<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Esen Sofrası — Yönetim Paneli</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f5f1ea; color: #2a2118; }
    header { background: linear-gradient(135deg, #e66102, #b84d02); color: #fff; padding: 14px 20px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    header .wrap { max-width: 860px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 18px; }
    header .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: none; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn.ghost { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
    .btn.white { background: #fff; color: #b84d02; }
    .btn.danger { background: #fff0f0; color: #c0392b; }
    main { max-width: 860px; margin: 0 auto; padding: 18px 16px 80px; }
    .cat { background: #fff; border: 1px solid #eadfd2; border-left: 4px solid #e66102; border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
    .cat-head { padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #fdfaf5; }
    .cat-head .grow { flex: 1 1 200px; }
    .cat-head input[type=text], .cat-head input[type=color] { font: inherit; }
    .cat-head .nm { font-size: 16px; font-weight: 700; width: 100%; }
    .cat-head .ds { font-size: 12.5px; color: #8a7a68; width: 100%; }
    .cat-head .ic { width: 52px; font-size: 18px; text-align: center; }
    .cat-head .clr { width: 46px; height: 40px; padding: 2px; border: 1px solid #eadfd2; border-radius: 8px; }
    .cat-head .rbtns { display: flex; gap: 6px; align-items: center; }
    input, textarea, select { border: 1px solid #eadfd2; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; background: #fff; }
    input:focus, textarea:focus { outline: 2px solid rgba(230,97,2,.35); border-color: #e66102; }
    .items { border-top: 1px solid #eadfd2; }
    .item { padding: 12px 16px; border-bottom: 1px solid #f0e7dc; display: grid; grid-template-columns: 52px 1fr; gap: 12px; }
    .item:last-child { border-bottom: none; }
    .item .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #eee5da; }
    .item .body { display: grid; gap: 8px; }
    .item .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .item .nm { flex: 1 1 160px; font-weight: 600; }
    .item .prc { width: 90px; }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; user-select: none; }
    .switch input { width: 16px; height: 16px; }
    .imgs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .imgs .mini { position: relative; }
    .imgs .mini img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; display: block; }
    .imgs .mini button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #c0392b; color: #fff; font-size: 12px; line-height: 1; cursor: pointer; }
    .mini-add { width: 52px; height: 52px; border-radius: 8px; border: 1.5px dashed #d9c9b8; background: #faf6f0; color: #b84d02; font-size: 20px; cursor: pointer; }
    .del-item { background: none; border: none; color: #c0392b; font-size: 13px; cursor: pointer; padding: 4px 6px; }
    .add-item { width: 100%; border: 1.5px dashed #d9c9b8; background: #faf6f0; color: #b84d02; font-size: 13.5px; font-weight: 600; padding: 10px; cursor: pointer; border-radius: 0 0 14px 14px; }
    .add-cat { width: 100%; border: 2px dashed #d9c9b8; background: #fff; color: #b84d02; font-size: 15px; font-weight: 700; padding: 16px; cursor: pointer; border-radius: 14px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2a1606; color: #fff; padding: 11px 20px; border-radius: 24px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .note { background: #fff7ec; border: 1px solid #ffdfb8; color: #8a5a1e; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>⚙️ Yönetim Paneli</h1>
      <div class="btns">
        <a class="btn ghost" href="index.html" target="_blank">Siteyi Gör</a>
        <button class="btn white" id="exportBtn">⬇ data.js Dışa Aktar</button>
        <button class="btn ghost" id="resetBtn">Sıfırla</button>
      </div>
    </div>
  </header>

  <main id="root">
    <div class="note">
      Değişiklikler otomatik olarak bu cihaza kaydedilir. Yayınlamak için
      <b>«data.js Dışa Aktar»</b> butonuna basıp indirilen dosyayı projeye koyun (commit + push).
    </div>
    <div id="list"></div>
    <button class="add-cat" id="addCatBtn">+ Yeni Kategori Ekle</button>
  </main>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
